[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uw-scan"
version = "0.12.15"
description = "Streamlit opportunity scanner for Unusual Whales data"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "pandas>=2.2",
  "playwright>=1.44",
  "pyarrow>=18.0",
  "pydantic>=2.7",
  "fastapi>=0.117,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "APScheduler>=3.11,<4.0",
  "tzdata>=2024.2",
  "beautifulsoup4>=4.14.3",
  "xlrd>=2.0.2",
  "openpyxl>=3.1.5",
  "pyyaml>=6.0",
  "websockets>=12.0",
  "scipy>=1.17.1",
  "arch==8.0.0",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary,pool]>=3.2",
]

[tool.ruff.format]
# Vendored VERBATIM from signal-lab (v13 density model) — bodies must stay
# byte-identical to source; the golden parity test pins behaviour. Never format.
# force-exclude makes the exclusion hold even when a hook passes the path explicitly.
exclude = [
  "src/uw_scan/density/constants.py",
  "src/uw_scan/density/cone.py",
  "src/uw_scan/density/fit.py",
]

[tool.ruff]
force-exclude = true

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-playwright>=0.5",
  "pytest-postgresql>=6",
  "ruff>=0.5",
  "pytest-asyncio>=0.24,<1.0",
  # Integration suite is sharded by recorded per-test duration (pytest-split) and
  # parallelised within each shard across cores (pytest-xdist). See tests/integration
  # conftest per-worker DB isolation + .github/workflows/ci.yml.
  "pytest-xdist>=3.6",
  "pytest-split>=0.9",
]
# Notebook/plotting tooling for docs/research/*.ipynb (not needed by the app/worker).
research = [
  "matplotlib>=3.8",
  "nbconvert>=7",
  "nbformat>=5",
  "ipykernel>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"uw_scan.cards" = ["data/*.json", "data/*.md"]
# The frozen v13 research panel is read at RUNTIME (density/forecast.py hashes it and
# checks the DB series against it before publishing a cone), so it must ship in the
# wheel — without it the container refuses every run on the digest check.
"uw_scan.density" = ["data/*.parquet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: requires local Postgres/integration fixtures; run in CI shards",
  "live: hits the real UW API; requires UW_SCAN_API_KEY",
]
