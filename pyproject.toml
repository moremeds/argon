[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uw-scan"
version = "0.10.0"
description = "Streamlit opportunity scanner for Unusual Whales data"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "pandas>=2.2",
  "playwright>=1.44",
  "pyarrow>=18.0",
  "pydantic>=2.7",
  "fastapi>=0.117,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "APScheduler>=3.11,<4.0",
  "tzdata>=2024.2",
  "beautifulsoup4>=4.14.3",
  "xlrd>=2.0.2",
  "openpyxl>=3.1.5",
  "pyyaml>=6.0",
  "websockets>=12.0",
  "scipy>=1.17.1",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary,pool]>=3.2",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-playwright>=0.5",
  "pytest-postgresql>=6",
  "ruff>=0.5",
  "pytest-asyncio>=0.24,<1.0",
  # Integration suite is sharded by recorded per-test duration (pytest-split) and
  # parallelised within each shard across cores (pytest-xdist). See tests/integration
  # conftest per-worker DB isolation + .github/workflows/ci.yml.
  "pytest-xdist>=3.6",
  "pytest-split>=0.9",
]
# Notebook/plotting tooling for docs/research/*.ipynb (not needed by the app/worker).
research = [
  "matplotlib>=3.8",
  "nbconvert>=7",
  "nbformat>=5",
  "ipykernel>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: requires local Postgres/integration fixtures; run in CI shards",
  "live: hits the real UW API; requires UW_SCAN_API_KEY",
]
