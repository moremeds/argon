name: Release

on:
  push:
    tags: ["v*"]

# Final releases mutate two shared :latest tags. Never let separate tag runs execute
# concurrently. The cutter is intentionally sequential: do not queue multiple tags.
concurrency:
  group: argon-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: verify tagged commit provenance
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      is-prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tagged commit to come from main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # CI is the single full-suite authority. The release PR merge starts a main
      # push run; cut.sh waits for it before tagging, and this repeats the exact-SHA
      # check as defense in depth for manually pushed tags. No coverage is removed:
      # the same immutable commit must have passed every ci.yml job once.
      - name: Require successful exact-SHA main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release/require_ci_success.py \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --workflow ci.yml \
            --branch main \
            --timeout-seconds 1800

      # Stdlib-only and deliberately before any dependency sync: validate committed
      # VERSION/pyproject/package/lock bytes without uv auto-repairing the lock.
      - name: Version sync check (committed state)
        run: python3 scripts/release/version_sync_check.py

      - name: Validate tag, changelog, and classify release
        id: release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          FILE_VERSION="$(cat VERSION)"
          MAIN_VERSION="$(git show origin/main:VERSION)"
          python3 scripts/release/validate_release.py \
            --tag-name "$TAG_NAME" \
            --file-version "$FILE_VERSION" \
            --main-version "$MAIN_VERSION" \
            --github-output "$GITHUB_OUTPUT"

          TAG_VERSION="${TAG_NAME#v}"
          BASE_VERSION="${TAG_VERSION%%-*}"
          source scripts/release/_lib.sh
          NOTES="$(extract_changelog_section CHANGELOG.md "$BASE_VERSION")"
          if [[ -z "${NOTES//[[:space:]]/}" ]]; then
            echo "CHANGELOG section for $BASE_VERSION is empty" >&2
            exit 1
          fi

  image-preflight:
    name: require new immutable image tags
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Version tags are immutable release evidence. A rerun must never replace
      # them with bytes rebuilt from drifted external inputs.
      - name: Require both version tags to be absent
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python3 scripts/release/promote_images.py require-absent \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --version "$RELEASE_VERSION" \
            --images argon-app argon-web

  build-images:
    name: build immutable image (${{ matrix.image }})
    needs: [verify, image-preflight]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: argon-app
            dockerfile: docker/app.Dockerfile
          - image: argon-web
            dockerfile: docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image tag
        id: meta
        env:
          IMAGE_NAME: ${{ matrix.image }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "tag=ghcr.io/${OWNER}/${IMAGE_NAME}:${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

      # Push only the immutable version here. Neither matrix leg can move :latest
      # until both legs have succeeded and the promotion job has preflighted them.
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Record build-produced digest
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p image-digest
          printf '%s\n' "$IMAGE_DIGEST" > "image-digest/$IMAGE_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.image }}
          path: image-digest/${{ matrix.image }}
          if-no-files-found: error
          retention-days: 1

  promote-latest:
    name: promote complete final image set to latest
    needs: [verify, build-images]
    if: ${{ needs.verify.outputs.is-prerelease == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true

      - name: Promote both images with rollback
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python3 scripts/release/promote_images.py promote \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --version "$RELEASE_VERSION" \
            --digest-dir image-digests \
            --images argon-app argon-web

  publish:
    name: publish GitHub Release after images
    needs: [verify, build-images, promote-latest]
    if: >-
      ${{ always() &&
          needs.verify.result == 'success' &&
          needs.build-images.result == 'success' &&
          (needs.verify.outputs.is-prerelease == 'true' ||
           needs.promote-latest.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract CHANGELOG section
        id: changelog
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          BASE_VERSION="$RELEASE_VERSION"
          BASE_VERSION="${BASE_VERSION%%-*}"
          source scripts/release/_lib.sh
          {
            echo 'body<<EOF'
            extract_changelog_section CHANGELOG.md "$BASE_VERSION"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ needs.verify.outputs.is-prerelease }}
          make_latest: ${{ needs.verify.outputs.is-prerelease == 'false' }}

      - name: Record deployment boundary
        env:
          IS_PRERELEASE: ${{ needs.verify.outputs.is-prerelease }}
        run: |
          {
            echo "### Release artifacts published"
            echo
            echo "Immutable images and the GitHub Release are complete."
            if [[ "$IS_PRERELEASE" == "false" ]]; then
              echo "Both :latest tags were promoted; Watchtower deployment is asynchronous and is not verified by this workflow."
            else
              echo "Prerelease: :latest was not changed and Watchtower will not deploy it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
