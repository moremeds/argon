name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: lint + unit + integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UW_SCAN_DB_HOST: 127.0.0.1
      UW_SCAN_DB_PORT: 5432
      UW_SCAN_DB_NAME: option_wizard
      UW_SCAN_DB_SCHEMA: uw_scan
      UW_SCAN_DB_USER: postgres
      UW_SCAN_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Sync deps
        run: uv sync --extra postgres

      - name: Ruff
        run: uv run ruff check src/ app/ tests/ scripts/

      - name: AST except handler check (Guardrail 2)
        run: uv run python scripts/_lint_except.py src app

      - name: Guardrail greps (3, 5, 9)
        run: |
          set -e
          # Guardrail 5: no fake cursor/connection in INTEGRATION tests (unit tests may stub freely)
          ! grep -rE 'class _Fake(Cursor|Connection)' tests/integration/ || (echo "Guardrail 5 violation: integration test uses fake cursor/connection"; exit 1)
          # Guardrail 9: no pipe-joined strings near SQL execute calls
          ! grep -rE '"\|".join\(' src/ app/ || (echo "Guardrail 9 violation"; exit 1)
          # Guardrail 3: no production code importing from tests/ or removed fixtures module
          ! grep -rE 'from tests' src/ app/ || (echo "Guardrail 3 violation"; exit 1)
          ! grep -rE 'from uw_scan\.fixtures' src/ app/ || (echo "Guardrail 3 violation"; exit 1)
          echo "guardrail greps clean"

      - name: Create option_wizard DB
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE option_wizard"

      - name: Unit tests
        run: uv run pytest tests/unit/ -v

      - name: Integration tests (no live API)
        # The live E2E (tests/integration/test_pipeline_e2e.py) is auto-skipped because UW_SCAN_API_KEY is not set on CI.
        run: uv run pytest tests/integration/ -v
