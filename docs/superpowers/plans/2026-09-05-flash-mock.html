  with each other. The premarket run issued three put debit spreads
  (QQQ 710/665, SPY 765/745, IWM 294/280) under ids QQQ-2026-09-03-1,
  SPY-2026-09-03-2, IWM-2026-09-03-3. The intraday drift-watcher and the
  close markout step of the same date tracked *bull call spreads*
  (QQQ 716/722, SPY 772/778) plus an SLV-2026-09-03-3 leg under those
  same first two ids — i.e. the ids do not resolve to the same
  structures across runs in the recorded data.
  Per the user's instruction this mock assumes id continuity: the
  intraday and close candidate-status rows below have been rewritten to
  track the three premarket structures by id and by legs. Every spot,
  gamma level and closing price in those rows is still the recorded
  number from the intraday/close transcripts; the status wording is a
  comparison of a recorded spot against a recorded entry/invalidation

<script>
"use strict";
const $ = (s,r)=> (r||document).querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
const fmtUSD = n => (n<0?"−":"+") + "$" + Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtInt = n => (n<0?"−":"+") + Math.abs(n).toLocaleString("en-US");
const sgn = s => /^[-−]/.test(String(s)) ? "neg" : "pos";

/* ---------------- payoff curve ------------------------------------------
   Piecewise-linear P&L at expiry, computed from the recorded legs and net
   debit only:  pnl(S) = 100 * ( intrinsic(long) - intrinsic(short) - net )  */
function intrinsic(right, K, S){ return right==="put" ? Math.max(K-S,0) : Math.max(S-K,0); }
function pnlAt(c, S){
  let v = 0;
  for(const [act,right,K] of c.legs) v += (act==="buy"?1:-1) * intrinsic(right,K,S);
  return (v - c.net) * 100;
}
function payoffSVG(c){
  const W=520,H=196, mL=52,mR=14,mT=16,mB=28;
  const iw=W-mL-mR, ih=H-mT-mB;
  const strikes = c.legs.map(l=>l[2]);
  const pts = strikes.concat([c.spot, c.be]);
  const lo0=Math.min.apply(null,pts), hi0=Math.max.apply(null,pts);
  const pad=0.18*(hi0-lo0), xlo=lo0-pad, xhi=hi0+pad;
  const ypad=0.08*(c.maxGain+c.maxLoss), ylo=-c.maxLoss-ypad, yhi=c.maxGain+ypad;
  const X = s => mL + (s-xlo)/(xhi-xlo)*iw;
  const Y = p => mT + (yhi-p)/(yhi-ylo)*ih;
  const y0 = Y(0);

  const brks = Array.from(new Set([xlo].concat(strikes.filter(k=>k>xlo&&k<xhi)).concat([c.be,xhi])))
                 .sort((a,b)=>a-b);
  const curve = brks.map(s=>({x:X(s), y:Y(pnlAt(c,s)), p:pnlAt(c,s)}));

  let g = "";
  /* grid + zero line */
  g += `<line x1="${mL}" y1="${Y(c.maxGain)}" x2="${W-mR}" y2="${Y(c.maxGain)}" stroke="var(--chart-grid)" stroke-width="1"/>`;
  g += `<line x1="${mL}" y1="${Y(-c.maxLoss)}" x2="${W-mR}" y2="${Y(-c.maxLoss)}" stroke="var(--chart-grid)" stroke-width="1"/>`;
  g += `<line x1="${mL}" y1="${y0}" x2="${W-mR}" y2="${y0}" stroke="var(--chart-axis)" stroke-width="1"/>`;

  /* signed areas + signed line, split at every sign change */
  for(let i=0;i<curve.length-1;i++){
    const a=curve[i], b=curve[i+1];
    const segs = (a.p>=0)===(b.p>=0) ? [[a,b]] : (function(){
      const t=(0-a.p)/(b.p-a.p), mx=a.x+(b.x-a.x)*t;
      return [[a,{x:mx,y:y0,p:0}],[{x:mx,y:y0,p:0},b]];
    })();
    for(const [p,q] of segs){
      const up = (p.p+q.p)>=0;
      g += `<polygon points="${p.x},${p.y} ${q.x},${q.y} ${q.x},${y0} ${p.x},${y0}" fill="${up?'var(--fill-pos)':'var(--fill-neg)'}"/>`;
      g += `<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="${up?'var(--positive)':'var(--negative)'}" stroke-width="2" stroke-linecap="round"/>`;
    }
  }
  /* strike ticks */
  for(const k of strikes){
    if(k<=xlo||k>=xhi) continue;
    g += `<line x1="${X(k)}" y1="${mT}" x2="${X(k)}" y2="${mT+ih}" stroke="var(--chart-grid)" stroke-width="1"/>`;
    g += `<text x="${X(k)}" y="${mT+ih+13}" fill="var(--text-muted)" font-family="var(--mono)" font-size="10" text-anchor="middle">${k.toFixed(2)}</text>`;
  }
  /* breakeven + spot markers (dashed, labelled — never colour-only) */
  g += `<line x1="${X(c.be)}" y1="${mT}" x2="${X(c.be)}" y2="${mT+ih}" stroke="var(--warn)" stroke-width="1" stroke-dasharray="3 3"/>`;
  g += `<line x1="${X(c.spot)}" y1="${mT}" x2="${X(c.spot)}" y2="${mT+ih}" stroke="var(--text-secondary)" stroke-width="1" stroke-dasharray="2 4"/>`;
  const beLeft = X(c.be) < X(c.spot);
  g += `<text x="${X(c.be)+(beLeft?-5:5)}" y="${mT+11}" fill="var(--warn)" font-family="var(--mono)" font-size="10" text-anchor="${beLeft?'end':'start'}">BE ${c.be.toFixed(2)}</text>`;
  g += `<text x="${X(c.spot)+(beLeft?5:-5)}" y="${mT+11}" fill="var(--text-secondary)" font-family="var(--mono)" font-size="10" text-anchor="${beLeft?'start':'end'}">SPOT ${c.spot.toFixed(2)}</text>`;
  /* y labels */
  g += `<text x="${mL-8}" y="${Y(c.maxGain)+4}" fill="var(--positive)" font-family="var(--mono)" font-size="10" font-weight="700" text-anchor="end">${fmtInt(c.maxGain)}</text>`;
  g += `<text x="${mL-8}" y="${y0+4}" fill="var(--text-muted)" font-family="var(--mono)" font-size="10" text-anchor="end">0</text>`;
  g += `<text x="${mL-8}" y="${Y(-c.maxLoss)+4}" fill="var(--negative)" font-family="var(--mono)" font-size="10" font-weight="700" text-anchor="end">${fmtInt(-c.maxLoss)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Profit and loss at expiry versus spot for the ${c.tkr} ${c.kind}. Maximum gain ${c.maxGain} dollars above the ${c.be} breakeven, maximum loss ${c.maxLoss} dollars below it, per contract.">${g}</svg>`;
}

/* ---------------- gamma bars ------------------------------------------- */
function gammaSVG(gp){
  const rows=[], seen=new Set();
  for(const r of gp.rows){ const key=r.k+"|"+r.l; if(seen.has(key)) continue; seen.add(key); rows.push(r); }
  const W=360, rowH=24, H=rows.length*rowH+14;
  const bx=132, bw=176, cx=bx+bw/2;
  const maxAbs=Math.max.apply(null, rows.map(r=>Math.abs(r.v)).concat([1]));
  let g = `<line x1="${cx}" y1="4" x2="${cx}" y2="${rows.length*rowH+2}" stroke="var(--chart-axis)" stroke-width="1"/>`;
  rows.forEach((r,i)=>{
    const y=i*rowH+4, h=13;
    const w=Math.abs(r.v)/maxAbs*(bw/2-4);
    const pos=r.v>=0;
    g += `<text x="0" y="${y+10}" fill="var(--text-primary)" font-family="var(--mono)" font-size="11" font-weight="700">${r.k.toFixed(2)}</text>`;
    g += `<text x="58" y="${y+10}" fill="var(--text-muted)" font-family="var(--mono)" font-size="9.5">${r.l}</text>`;
    if(r.v===0){
      g += `<rect x="${cx-1}" y="${y}" width="2" height="${h}" fill="var(--text-muted)"/>`;
    } else if(pos){
      g += `<rect x="${cx+1}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="var(--positive)" opacity="0.85"/>`;
    } else {
      g += `<rect x="${cx-1-w}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="var(--negative)" opacity="0.85"/>`;
    }
    g += `<text x="${W}" y="${y+10}" fill="${r.v===0?'var(--text-muted)':(pos?'var(--positive)':'var(--negative)')}" font-family="var(--mono)" font-size="10" font-weight="700" text-anchor="end">${r.v===0?'0':fmtInt(r.v)}</text>`;
  });
  g += `<text x="${cx}" y="${rows.length*rowH+12}" fill="var(--text-muted)" font-family="var(--mono)" font-size="9" text-anchor="middle">− short gamma · 0 · long gamma +</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Dealer gamma by strike for ${gp.tkr}. Bars left of the zero axis are negative gamma, bars right are positive.">${g}</svg>`;
}

/* ---------------- small builders ---------------------------------------- */
function panel(title, tail, bodyHTML, bodyClass){
  return `<section class="panel"><h3>${title}${tail?`<span class="tail">${tail}</span>`:""}</h3><div class="${bodyClass||"pbody"}">${bodyHTML}</div></section>`;
}
/* One tile shape in every phase: label, value, signed change.
   A tile whose source carries no change renders an em dash, muted —
   it is never back-filled from another phase. Provenance lives on the
   tile's title= tooltip and in the sources line under the row.        */
function tapeHTML(rows, srcLine){
  const cells = rows.map(r=>{
    const k = Array.isArray(r) ? r[0] : r.k;
    const v = Array.isArray(r) ? r[1] : r.v;
    const c = Array.isArray(r) ? r[2] : r.c;
    const src = Array.isArray(r) ? "" : (r.src||"");
    const chg = (c==null||c==="")
      ? `<span class="chg mut" aria-label="no change recorded">&mdash;</span>`
      : `<span class="chg ${sgn(c)}">${String(c).replace(/^-/,"−")}</span>`;
    return `<div class="tile"${src?` title="${src}"`:""}><span class="lbl">${k}</span><span class="v">${v}</span>${chg}</div>`;
  }).join("");
  const cols=Math.ceil(rows.length/Math.ceil(rows.length/7)); return `<div class="tape" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${cells}</div>`;
}
function decisionHTML(rows){
  return `<div class="dec">` + rows.map(([k,v,lead])=>
    `<div class="k">${k}</div><div class="v${lead?" call":""}">${v}</div>`).join("") + `</div>`;
}
function candidateHTML(c, compact){
  const legs = `<table><thead><tr><th>Action</th><th>Right</th><th class="n">Strike</th><th>Expiry</th><th class="n">Mid</th></tr></thead><tbody>` +
    c.legs.map(([a,r,k,e,m])=>`<tr><td class="mono ${a==="buy"?"pos":"neg"}">${a}</td><td class="mono sec">${r}</td><td class="n">${k.toFixed(2)}</td><td class="mono mut">${e}</td><td class="n">${m}</td></tr>`).join("") +
    `</tbody></table>
    <div class="pricing">
      <div><span class="lbl">Net debit</span><span class="num" style="font-size:16px">$${c.net.toFixed(2)}</span><span class="src mut mono" style="font-size:9.5px">per share</span></div>
      <div><span class="lbl">Max gain</span><span class="num pos" style="font-size:16px">${fmtUSD(c.maxGain)}</span><span class="src mut mono" style="font-size:9.5px">per contract</span></div>
      <div><span class="lbl">Max loss</span><span class="num neg" style="font-size:16px">${fmtUSD(-c.maxLoss)}</span><span class="src mut mono" style="font-size:9.5px">per contract</span></div>
    </div>`;
  return `<article class="cand">
    <div class="candhead">
      <span class="tkr">${c.tkr}</span>
      <span class="chip">${c.kind.replace(/_/g," ")}</span>
      <span class="mono mut" style="font-size:11px">Exp ${c.exp}${c.dte?" · "+c.dte+" DTE":""} · Spot ${c.spot.toFixed(2)} · Width ${c.width.toFixed(2)}</span>
      <div class="lvls">
        <div><span class="lbl">Entry</span><span class="num" style="font-size:13px">${c.entry}</span></div>
        ${c.add?`<div><span class="lbl">Add</span><span class="num sec" style="font-size:13px">${c.add}</span></div>`:""}
        <div><span class="lbl">Target</span><span class="num sec" style="font-size:13px">${c.target}</span></div>
        <div><span class="lbl">Invalidation</span><span class="num neg" style="font-size:13px">${c.inval}</span></div>
      </div>
    </div>
    <div class="candbody">
      <div class="legwrap">${legs}</div>
      <div class="pnlwrap"><span class="lbl" style="display:block;margin-bottom:2px">Payoff at expiry vs spot &middot; $ per contract</span>${payoffSVG(c)}</div>
    </div>
    <div class="rationale"><p>${c.why}</p><span class="cid">${c.id}</span></div>
  </article>`;
}
function proseHTML(sections){
  return `<div class="prose">` + sections.map(s=>`<div><h4>${s.t}</h4><p>${s.b}</p></div>`).join("") + `</div>`;
}
function faultsHTML(list){
  return `<ul style="margin:0;padding-left:16px;color:var(--text-muted);font-size:11.5px;line-height:1.7">` +
    list.map(f=>`<li>${f}</li>`).join("") + `</ul>`;
}
function gexTable(rows){
  return `<div class="scrollx"><table class="deltas"><thead><tr><th>Ticker</th><th class="n">Spot</th><th class="n">Flip</th><th class="n">Magnet</th><th class="n">Call wall</th><th class="n">Put wall</th></tr></thead><tbody>` +
    rows.map(r=>`<tr><td class="mono" style="font-weight:700">${r[0]}</td><td class="n">${r[1]}</td><td class="n">${r[2]}</td><td class="n">${r[3]}</td><td class="n pos">${r[4]}</td><td class="n neg">${r[5]}</td></tr>`).join("") +
    `</tbody></table></div>`;
}

/* ---------------- premarket view ---------------------------------------- */
function viewPremarket(d){
  const p = d.runs.premarket;
  const sched = `<table><thead><tr><th>Time</th><th>Event</th><th class="n">Cons / prior</th></tr></thead><tbody>` +
    p.schedule.map(s=>`<tr>${s.g?`<td class="mono" style="white-space:nowrap"><span class="lbl" style="display:block;color:var(--text-muted)">${s.g}</span>${s.t}</td>`:`<td class="mono sec" style="white-space:nowrap">${s.t}</td>`}<td class="sec">${s.e}</td><td class="n sec" style="white-space:nowrap">${s.c||"&mdash;"}</td></tr>`).join("") +
    `</tbody></table>`;
  const policy = `<div class="path">` + p.policy.map(x=>
    `<div><span class="lbl">${x.d}</span><span class="num" style="font-size:15px">${x.r}</span><span class="mono mut" style="font-size:9.5px">${x.band}</span><span class="mono ${x.call==="HIKE"?"neg":"sec"}" style="font-size:10.5px;font-weight:700;letter-spacing:.6px">${x.call} ${x.p}</span></div>`).join("") + `</div>`;
  const gamma = p.gamma.map(gp=>
    `<div class="gx"><div class="gxh"><span class="mono" style="font-size:13px;font-weight:700">${gp.tkr}</span><span class="mono mut" style="font-size:10px">Spot ${gp.spot}</span></div>${gammaSVG(gp)}</div>`).join("");
  const risk = `<table><thead><tr><th>Ticker</th><th>Reason dropped</th></tr></thead><tbody>` +
    p.risk.map(([t,r])=>`<tr><td class="mono" style="font-weight:700;vertical-align:top">${t}</td><td class="sec">${r}</td></tr>`).join("") + `</tbody></table>`;
  const cov = `<table class="cov"><tbody>` + p.coverage.map(([k,st,note])=>
    `<tr><td class="mono" style="vertical-align:top">${k}</td><td style="vertical-align:top;width:22px">${st==="ok"?'<span class="ok">&#10003;</span>':'<span class="skip">&mdash;</span>'}</td><td class="mut" style="font-size:11.5px">${note}</td></tr>`).join("") + `</tbody></table>`;

  return `
  ${tapeHTML(p.tape,p.tapeSrc)}
  <div class="lead" style="margin-top:12px"><span class="lbl">Today in<br>one sentence</span><p>${p.one}</p></div>
  <div class="cols">
    <div class="colL">
      ${panel("Bottom line &middot; decision block","",decisionHTML(p.decision),"")}
      <div>
        <div class="lbl" style="padding:2px 0 8px">Candidates &middot; per contract, no size</div>
        <div class="stack">${p.candidates.map(c=>candidateHTML(c)).join("")}</div>
      </div>
      ${panel("Sections","",proseHTML(p.sections))}
    </div>
    <div class="colR">
      ${panel("Overnight","",`<p style="margin:0;color:var(--text-secondary);font-size:12.5px;line-height:1.55">${p.overnight}</p>`)}
      ${panel("Today's schedule","",sched)}
      ${panel("Rates &amp; policy path","",policy + `<p class="mut" style="margin:9px 0 0;font-size:11px;line-height:1.5">Fed-funds futures via argon, snapshot 2026-09-02; not CME FedWatch.</p>`)}
      ${panel("Gamma profile","dealer gamma per strike",gamma + `<p class="mut" style="margin:12px 0 0;font-size:11px;line-height:1.5">A bar is its size, its side of the axis the sign. Left of zero is negative gamma, where hedging amplifies rather than damps. Duplicate strike rows from argon are collapsed.</p>`)}
      ${panel("Risk register","dropped this run",risk)}
      ${panel("Data coverage","",cov)}
    </div>
  </div>
  <p class="mut" style="font-size:11.5px;margin:14px 0 0">All structures are defined-risk. No quantities, position sizes or account information appear anywhere in this flash.</p>`;
}

/* ---------------- intraday / close supplements --------------------------- */

function viewIntraday(d){
  const r = d.runs.intraday;
  const drift = r.drift.map((x,i)=>
    `<div style="padding:10px 0;${i===r.drift.length-1?"":"border-bottom:1px solid rgba(30,41,59,.55)"}">
       <div style="display:flex;gap:10px;align-items:baseline;margin-bottom:4px">
         <span class="mono" style="font-size:12px;font-weight:700">${x.t}</span>
         ${x.s?`<span class="state ${x.up?"up":"hold"}" style="margin-left:auto">${x.s}</span>`:""}
       </div>
       <p style="margin:0;color:var(--text-secondary);font-size:12.5px;line-height:1.55;max-width:96ch">${x.b}</p>
     </div>`).join("");
  return `
  ${tapeHTML(r.tape,r.tapeSrc)}
  <div class="lead" style="margin-top:12px"><span class="lbl">Intraday<br>read</span><p style="font-size:15px">${r.headline}</p></div>
  <div class="supgrid">
    <div class="colL">
      ${panel("Candidate status &middot; drift watch","as of "+r.asOf,drift)}
      ${panel("Run sections","full transcript, this run",`<div class="scroll">${proseHTML(r.sections)}</div>`)}
    </div>
    <div class="colR">
      ${panel("Dealer gamma levels","gex-reporter &middot; "+r.asOf,gexTable(r.gex))}
      ${panel("Run","recorded faults",`<span class="mono mut" style="font-size:11px;word-break:break-all;display:block;margin-bottom:8px">${r.run}</span>`+faultsHTML(r.faults))}
    </div>
  </div>`;
}

function viewClose(d){
  const r = d.runs.close;
  const pre = d.runs.intraday.gex, cls = r.gex;
  const fields = ["Spot","Gamma flip","Magnet","Call wall","Put wall"];
  let deltaRows = "";
  for(let t=0;t<cls.length;t++){
    for(let f=1;f<=5;f++){
      const a = parseFloat(pre[t][f]), b = parseFloat(cls[t][f]), dv = b-a;
      const chg = (dv===0) ? "0.00" : (dv>0?"+":"−") + Math.abs(dv).toFixed(2);
      deltaRows += `<tr><td class="mono" style="font-weight:700">${f===1?cls[t][0]:""}</td><td class="mut" style="font-size:11.5px">${fields[f-1]}</td><td class="n mut">${pre[t][f]}</td><td class="n"><span class="arrow">&rarr;</span>${cls[t][f]}</td><td class="n ${dv===0?"mut":(dv>0?"pos":"neg")}">${chg}</td></tr>`;
    }
  }
  const markout = r.markout.map((m,i)=>
    `<div style="padding:10px 0;${i===r.markout.length-1?"":"border-bottom:1px solid rgba(30,41,59,.55)"}">
       <div style="display:flex;gap:10px;align-items:baseline;margin-bottom:4px">
         <span class="mono" style="font-size:12px;font-weight:700">${m.id}</span>
         <span class="state ${m.up?"up":"hold"}" style="margin-left:auto">${m.s}</span>
       </div>
       <p style="margin:0;color:var(--text-secondary);font-size:12.5px;line-height:1.55;max-width:96ch">${m.b}</p>
     </div>`).join("");
  const risk = `<table><tbody>` + r.risk.map(([t,x])=>`<tr><td class="mono" style="font-weight:700;vertical-align:top">${t}</td><td class="sec" style="font-size:12px">${x}</td></tr>`).join("") + `</tbody></table>`;
  const recap = `<div class="prose">` + r.recap.map(s=>`<div><h4>${s.t}</h4><p class="pre">${s.b}</p></div>`).join("") + `</div>`;
  return `
  ${tapeHTML(r.tape,r.tapeSrc)}
  <div class="lead" style="margin-top:12px"><span class="lbl">Close<br>read</span><p style="font-size:15px">${r.headline}</p></div>
  <div class="supgrid">
    <div class="colL">
      ${panel("Candidate status &middot; markout at the close","",markout)}
      ${panel("New structure proposed at the close","survived risk review",candidateHTML(r.newCand) + `<div class="note">${r.reviewNote}</div>`,"")}
      ${panel("Close decision block","",decisionHTML(r.decision),"")}
      ${panel("Recap","recap-writer",`<div class="scroll">${recap}</div>`)}
    </div>
    <div class="colR">
      ${panel("What changed &middot; gamma levels","intraday 17:00Z &rarr; close 20:14Z",`<div class="scrollx"><table class="deltas"><thead><tr><th>Ticker</th><th>Level</th><th class="n">17:00Z</th><th class="n">Close</th><th class="n">&Delta;</th></tr></thead><tbody>${deltaRows}</tbody></table></div>`)}
      ${panel("Risk register","dropped in design",risk)}
      ${panel("Run","recorded faults",`<span class="mono mut" style="font-size:11px;word-break:break-all;display:block;margin-bottom:8px">${r.run}</span>`+faultsHTML(r.faults))}
    </div>
  </div>`;
}

/* ---------------- empty states ------------------------------------------ */
function skeletonPremarket(){
  const tiles = Array(9).fill(0).map(()=>`<div class="tile" style="min-height:58px"><div class="ghost" style="width:34px"></div><div class="ghost" style="width:70%;height:16px;margin-top:6px"></div></div>`).join("");
  const rail = ["Overnight","Today's schedule","Rates &amp; policy path","Gamma profile","Risk register","Data coverage"]
    .map(t=>`<section class="panel"><h3>${t}</h3><div class="pbody"><div class="ghostbox" style="height:${t==="Gamma profile"?110:52}px"></div></div></section>`).join("");
  return `<div class="skel" aria-hidden="true">
    <div class="tape">${tiles}</div>
    <div class="lead" style="margin-top:12px"><span class="lbl">Today in<br>one sentence</span><div style="flex:1"><div class="ghost" style="width:78%;height:13px"></div><div class="ghost" style="width:46%;height:13px;margin-top:8px"></div></div></div>
    <div class="cols">
      <div class="colL">
        <section class="panel"><h3>Bottom line &middot; decision block</h3><div class="pbody"><div class="ghostbox" style="height:132px"></div></div></section>
        <div><div class="lbl" style="padding:2px 0 8px">Candidates</div><div class="ghostbox" style="height:150px"></div></div>
        <section class="panel"><h3>Sections</h3><div class="pbody"><div class="ghostbox" style="height:90px"></div></div></section>
      </div>
      <div class="colR">${rail}</div>
    </div>
  </div>`;
}
function viewEmptyDay(d, phase){
  const isFuture = d.date === "2026-09-04";
  const msg = isFuture
    ? `The ${phase} run for ${d.date} has not been recorded yet. Nothing is shown in its place.`
    : `No option-wizard ${phase} run was recorded for ${d.date}. The layout below is the empty shell, not a rendered flash.`;
  return `<div class="empty" style="margin-bottom:12px">
      <span class="big">No run recorded</span>
      <p>${msg}</p>
      <p class="mono" style="font-size:11px;color:var(--text-muted)">helium audit &mdash; 0 runs for tenant option-wizard, phase ${phase}, date ${d.date}</p>
    </div>` + skeletonPremarket();
}

/* ---------------- weekly view ------------------------------------------- */
function viewWeek(){
  const rows = WEEK.days.map(d=>{
    const p = d.runs.premarket;
    return `<div class="wkrow">
      <div class="d"><span class="dow">${d.dow}</span><span class="dt">${d.date}</span></div>
      <div class="tw">${p?`<div class="t">${p.one}</div>`:`<div class="t none">no run recorded</div>`}<span class="runs mono ${p?"pos":"mut"}">${p?"3 runs":"0 runs"}</span></div>
    </div>`;
  }).join("");
  return `
  <div class="band" style="margin-bottom:12px">
    <span class="lbl">Layout<br>placeholder</span>
    <p><strong style="color:var(--text-primary)">This view is not generated yet.</strong> When the weekly job runs it will hold three things: the five daily one-liners stacked below (each pulled from that day's premarket "today in one sentence"); an <strong style="color:var(--text-primary)">Outlook</strong> block written after Friday's close covering the week ahead; and a slot for <strong style="color:var(--text-primary)">Frank 复盘</strong>, the external weekly review, which attaches to this weekly summary rather than to any single day. Only the Thursday row below carries real content — it is the only day of this week with a recorded run.</p>
  </div>
  ${panel("Five daily one-liners","2026-08-31 &rarr; 2026-09-04",rows,"")}
  <div class="cols" style="margin-top:12px">
    <div class="colL">
      <section class="panel"><h3>Outlook &middot; week ahead<span class="tail">not yet available</span></h3><div class="pbody">
        <div class="empty" style="border:none;background:none;padding:26px 12px">
          <span class="big">Generated Friday after close</span>
          <p>The outlook block is written by the weekly job once Friday's close run has landed. As of 2026-09-04 that run has not been recorded, so there is nothing to show.</p>
        </div>
        <div class="skel" aria-hidden="true"><div class="ghostbox" style="height:88px"></div></div>
      </div></section>
    </div>
    <div class="colR">
      <section class="panel"><h3>Frank &#22797;&#30424;<span class="tail">supplement slot</span></h3><div class="pbody">
        <div class="empty" style="border:none;background:none;padding:22px 12px">
          <span class="big">No review attached</span>
          <p>An external weekly review, attached to the weekly summary on Monday. None recorded for this week.</p>
        </div>
        <div class="skel" aria-hidden="true"><div class="ghostbox" style="height:70px"></div></div>
      </div></section>
    </div>
  </div>`;
}

/* ---------------- controller -------------------------------------------- */
const PHASES = [["premarket","Premarket"],["intraday","Intraday"],["close","Close"]];
let sel = {day:"thu", phase:"premarket"};

function renderStrip(){
  const s = $("#strip"); s.innerHTML = "";
  for(const d of WEEK.days){
    const p = d.runs.premarket;
    const b = el("button","dcard");
    b.type="button"; b.setAttribute("aria-pressed", String(sel.day===d.key));
    b.innerHTML = `<div class="dh"><span class="dow">${d.dow}</span><span class="dt">${d.md}</span></div>
      <div class="one${p?"":" norun"}">${p?p.one:"no run recorded"}</div>
      <div class="pips">${PHASES.map(([k,l])=>`<span class="pip${d.runs[k]?" on":""}" title="${l}">${l[0]}</span>`).join("")}</div>`;
    b.addEventListener("click",()=>{ sel.day=d.key; if(!WEEK.days.find(x=>x.key===d.key).runs[sel.phase]) sel.phase="premarket"; render(); });
    s.appendChild(b);
  }
  const w = el("button","dcard wk");
  w.type="button"; w.setAttribute("aria-pressed", String(sel.day==="week"));
  w.innerHTML = `<div class="dh"><span class="dow">WEEK</span><span class="dt">W36</span></div>
    <div class="one norun">summary &amp; outlook &mdash; generated Friday after close</div>
    <div class="pips"><span class="pip" title="Weekly summary">S</span><span class="pip" title="Outlook">O</span><span class="pip" title="Frank fupan">F</span></div>`;
  w.addEventListener("click",()=>{ sel.day="week"; render(); });
  s.appendChild(w);
}

function render(){
  renderStrip();
  const stage = $("#stage");
  if(sel.day==="week"){ stage.innerHTML = `<div class="phbar"><span class="ph" aria-selected="true">Weekly summary &amp; outlook</span><span class="asof lbl">not generated</span></div>` + viewWeek(); return; }
  const d = WEEK.days.find(x=>x.key===sel.day);
  const has = k => !!d.runs[k];
  const asOf = d.runs[sel.phase] ? (d.runs[sel.phase].asOf || "") : "";
  let bar = `<div class="phbar">` + PHASES.map(([k,l])=>
      `<button class="ph" type="button" role="tab" data-ph="${k}" aria-selected="${sel.phase===k}" ${has(k)?"":"disabled"}><span class="dot"></span>${l}${k!=="premarket"?"":""}</button>`).join("")
    + `<span class="asof lbl">${asOf?("as of "+asOf):("no run recorded for "+d.date)}</span></div>`;
  let body;
  if(!has(sel.phase)) body = viewEmptyDay(d, sel.phase);
  else if(sel.phase==="premarket") body = viewPremarket(d);
  else if(sel.phase==="intraday") body = viewIntraday(d);
  else body = viewClose(d);
  stage.innerHTML = bar + body;
  stage.querySelectorAll(".ph[data-ph]").forEach(b=>{
    if(b.disabled) return;
    b.addEventListener("click",()=>{ sel.phase = b.dataset.ph; render(); });
  });
}
render();
</script>
